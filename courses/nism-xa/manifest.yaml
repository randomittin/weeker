# Weeker course manifest — NISM Series X-A: Investment Adviser (Level 1)
#
# This is the single declared input to `weeker ingest run`. It encodes the
# VERIFIED NISM X-A exam pattern (see atlas-spec/017 §1) and points at the
# workbook PDF you must drop in yourself (see `sources` below).
#
# Validation is strict (src/weeker/ingest/manifest.py): the exam total_marks
# must equal the sum of the sections, and any blueprint.overrides must sum to 1.0.

course:
  title: "NISM Series X-A: Investment Adviser (Level 1)"
  slug: nism-xa

sources:
  # Drop the official NISM X-A workbook PDF at this exact path before ingesting.
  # The file is NOT committed to the repo — you supply it. `weeker ingest run`
  # hashes it (sha256) for idempotent re-ingestion.
  - filename: nism-xa-workbook.pdf
    path: nism-xa-workbook.pdf     # resolved relative to this manifest's directory
    page_offset: 0                 # set to (printed page 1's PDF index - 1) if the PDF has front matter

# VERIFIED exam pattern (atlas-spec/017 §1): 90 standalone 1-mark MCQs
# + 6 caselets x 5 x 1-mark + 3 caselets x 5 x 2-mark = 150 marks, pass at 90,
# 180 minutes, negative marking = 25% of the question's own marks.
exam:
  duration_minutes: 180
  passing_marks: 90
  total_marks: 150
  negative_marking_fraction: 0.25
  sections:
    - kind: standalone
      questions: 90
      marks_each: 1
    - kind: caselet
      count: 6
      questions_each: 5
      marks_each: 1
    - kind: caselet
      count: 3
      questions_each: 5
      marks_each: 2

# Blueprint weightage for the ACTUAL ingested workbook.
#
# EDITION NOTE: the supplied PDF is the older 12-chapter NISM X-A workbook edition
# (the chapter titles below are exactly what ingestion detected from THIS PDF).
# The current official NISM X-A outline (docs/analysis/nism-xa-blueprint.md, from
# nism.ac.in) is restructured into 20 chapters / 6 modules — so this workbook may
# predate the current syllabus. For studying THIS workbook the weights below are
# correct; if your exam follows the current syllabus, verify your edition.
#
# NISM publishes no per-unit weightage, so these are the detected 12 chapters with
# weights auto-derived by concept count at build time. This explicit block is keyed
# to the EXACT detected titles (used for mock chapter-stratification). To let the
# engine derive weights purely from reviewed-concept counts instead, set
# `blueprint: {}`. Overrides must sum to 1.0.
blueprint:
  overrides:
    "Chapter 1: INTRODUCTION TO INDIAN FINANCIAL MARKET": 0.0833
    "Chapter 2: SECURITIES MARKET SEGMENTS": 0.0833
    "Chapter 3: MUTUAL FUNDS": 0.0833
    "Chapter 4: INVESTMENT PRODUCTS": 0.0833
    "Chapter 5: MANAGING INVESTMENT RISK": 0.0833
    "Chapter 6: MEASURING INVESTMENT RETURNS": 0.0833
    "Chapter 7: CONCEPT OF FINANCIAL PLANNING": 0.0833
    "Chapter 8: ASSET ALLOCATION AND INVESTMENT STRATEGIES": 0.0833
    "Chapter 9: INSURANCE PLANNING": 0.0833
    "Chapter 10: RETIREMENT PLANNING": 0.0833
    "Chapter 11: TAX AND ESTATE PLANNING": 0.0833
    "Chapter 12: REGULATORY ENVIRONMENT AND ETHICAL ISSUES": 0.0837
