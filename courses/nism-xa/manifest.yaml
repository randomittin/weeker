# Weeker course manifest — NISM Series X-A: Investment Adviser (Level 1)
#
# This is the single declared input to `weeker ingest run`. It encodes the
# VERIFIED NISM X-A exam pattern (see atlas-spec/017 §1) and points at the
# workbook PDF you must drop in yourself (see `sources` below).
#
# Validation is strict (src/weeker/ingest/manifest.py): the exam total_marks
# must equal the sum of the sections, and any blueprint.overrides must sum to 1.0.

course:
  title: "NISM Series X-A: Investment Adviser (Level 1)"
  slug: nism-xa

sources:
  # Drop the official NISM X-A workbook PDF at this exact path before ingesting.
  # The file is NOT committed to the repo — you supply it. `weeker ingest run`
  # hashes it (sha256) for idempotent re-ingestion.
  - filename: nism-xa-workbook.pdf
    path: nism-xa-workbook.pdf     # resolved relative to this manifest's directory
    page_offset: 0                 # set to (printed page 1's PDF index - 1) if the PDF has front matter

# VERIFIED exam pattern (atlas-spec/017 §1): 90 standalone 1-mark MCQs
# + 6 caselets x 5 x 1-mark + 3 caselets x 5 x 2-mark = 150 marks, pass at 90,
# 180 minutes, negative marking = 25% of the question's own marks.
exam:
  duration_minutes: 180
  passing_marks: 90
  total_marks: 150
  negative_marking_fraction: 0.25
  sections:
    - kind: standalone
      questions: 90
      marks_each: 1
    - kind: caselet
      count: 6
      questions_each: 5
      marks_each: 1
    - kind: caselet
      count: 3
      questions_each: 5
      marks_each: 2

# Real NISM Series X-A chapter list — the 20 chapters / 6 modules verified against
# the official NISM Test Objectives page (see docs/analysis/nism-xa-blueprint.md,
# sourced from nism.ac.in). NISM does NOT publish per-unit weightage for X-A, so
# these are an EVEN split (20 x 0.05 = 1.0) — a documented, honest fallback, NOT
# authoritative weighting.
#
# After your first `weeker ingest run`:
#   1. Weights are keyed by the chapter TITLE ingestion detects from the PDF
#      (printed as "structure (...): N chapters"). A key that does not match a
#      detected title is silently ignored — reconcile these titles with what your
#      workbook edition actually prints if they differ.
#   2. Optionally replace the even 0.05 weights with a depth-weighted split
#      (e.g. by workbook page-count per chapter). Overrides must still sum to 1.0.
# Leave this block as `blueprint: {}` to instead auto-derive weights from the
# reviewed-concept count per chapter.
blueprint:
  overrides:
    # Module 1 — Personal Financial Planning
    "Introduction to Personal Financial Planning": 0.05
    "Time Value of Money": 0.05
    "Cash Flow Management and Budgeting": 0.05
    "Debt Management and Loans": 0.05
    # Module 2 — Indian Financial Markets
    "Introduction to Indian Financial Markets": 0.05
    "Securities Market Segments": 0.05
    # Module 3 — Investment Products
    "Introduction to Investments": 0.05
    "Investing in Stocks": 0.05
    "Investing in Fixed Income Securities": 0.05
    "Understanding Derivatives": 0.05
    # Module 4 — Investment through Managed Portfolio
    "Mutual Fund": 0.05
    "Portfolio Manager": 0.05
    "Overview of Alternative Investment Funds (AIFs)": 0.05
    # Module 5 — Portfolio Construction, Performance Monitoring and Evaluation
    "Introduction to Modern Portfolio Theory": 0.05
    "Portfolio Construction Process": 0.05
    "Portfolio Performance Measurement and Evaluation": 0.05
    # Module 6 — Operations, Regulatory Environment, Compliance and Ethics
    "Operational Aspects of Investment Management": 0.05
    "Key Regulations": 0.05
    "Ethical Issues": 0.05
    "Grievance Redress Mechanism": 0.05
